<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Checkout - Rajathadri Palace
    </title>

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {

            --gold: #d4af37;

            --gold-light: #f3e5ab;

            --bg: #080808;

            --card: #151515;

            --text: #ffffff;

            --gray: #aaaaaa;

        }


        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        body {

            min-height: 100vh;

            background:

                linear-gradient(
                    rgba(0,0,0,.65),
                    rgba(0,0,0,.9)
                ),

                url("images/1000203876.png");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            color: var(--text);

            font-family: 'Montserrat', sans-serif;

            padding-bottom: 40px;

        }


        .header {

            text-align: center;

            padding: 25px 15px;

            border-bottom: 1px solid
                rgba(212,175,55,.4);

        }


        .logo {

            font-family: 'Cinzel', serif;

            color: var(--gold);

            font-size: 1.7rem;

            letter-spacing: 2px;

        }


        .subtitle {

            color: var(--gold-light);

            font-size: .7rem;

            letter-spacing: 2px;

            margin-top: 5px;

        }


        .container {

            width: min(600px, 94%);

            margin: 25px auto;

        }


        .table-box {

            text-align: center;

            border: 1px solid var(--gold);

            border-radius: 12px;

            padding: 15px;

            margin-bottom: 20px;

            background: rgba(0,0,0,.65);

        }


        .table-box p {

            color: var(--gray);

            font-size: .8rem;

            margin-bottom: 5px;

        }


        .table-box h2 {

            color: var(--gold);

            font-family: 'Cinzel', serif;

        }


        .card {

            background: rgba(21,21,21,.96);

            border: 1px solid
                rgba(212,175,55,.3);

            border-radius: 14px;

            padding: 20px;

            margin-bottom: 18px;

        }


        .card h2 {

            color: var(--gold);

            font-family: 'Cinzel', serif;

            margin-bottom: 18px;

            font-size: 1.3rem;

        }


        .order-item {

            display: flex;

            justify-content: space-between;

            gap: 10px;

            padding: 12px 0;

            border-bottom:
                1px solid rgba(255,255,255,.08);

        }


        .item-name {

            font-weight: 500;

        }


        .item-details {

            color: var(--gray);

            font-size: .8rem;

            margin-top: 4px;

        }


        .item-price {

            color: var(--gold);

            white-space: nowrap;

        }


        .total {

            display: flex;

            justify-content: space-between;

            padding-top: 18px;

            margin-top: 5px;

            border-top: 1px solid var(--gold);

            font-size: 1.2rem;

        }


        .total strong:last-child {

            color: var(--gold);

        }


        label {

            display: block;

            color: var(--gold-light);

            font-size: .85rem;

            margin-bottom: 7px;

        }


        input,

        textarea {

            width: 100%;

            background: #0c0c0c;

            color: white;

            border: 1px solid #444;

            border-radius: 8px;

            padding: 13px;

            margin-bottom: 16px;

            font-family: inherit;

            outline: none;

        }


        input:focus,

        textarea:focus {

            border-color: var(--gold);

        }


        textarea {

            resize: vertical;

            min-height: 80px;

        }


        .payment-option {

            display: flex;

            align-items: center;

            gap: 12px;

            border: 1px solid #444;

            border-radius: 10px;

            padding: 15px;

            margin-bottom: 10px;

            cursor: pointer;

        }


        .payment-option:has(input:checked) {

            border-color: var(--gold);

            background:
                rgba(212,175,55,.08);

        }


        .payment-option input {

            width: auto;

            margin: 0;

            accent-color: var(--gold);

        }


        .payment-title {

            font-weight: 600;

        }


        .payment-description {

            color: var(--gray);

            font-size: .75rem;

            margin-top: 3px;

        }


        .place-order {

            width: 100%;

            border: 2px solid var(--gold);

            background: #651010;

            color: white;

            border-radius: 30px;

            padding: 15px;

            font-family: 'Cinzel', serif;

            font-size: 1.05rem;

            cursor: pointer;

            margin-top: 5px;

        }


        .place-order:disabled {

            opacity: .5;

            cursor: not-allowed;

        }


        .back-button {

            display: block;

            text-align: center;

            color: var(--gold);

            text-decoration: none;

            margin: 20px 0;

            font-size: .85rem;

        }


        .error {

            display: none;

            background: #4a1010;

            border: 1px solid #b33;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 15px;

            font-size: .85rem;

        }

    </style>

</head>


<body>


<header class="header">

    <div class="logo">
        RAJATHADRI PALACE
    </div>

    <div class="subtitle">
        TRADITION • TASTE • TRUST
    </div>

</header>


<div class="container">


    <div class="table-box">

        <p>
            YOU ARE ORDERING FROM
        </p>

        <h2 id="tableNumber">
            TABLE
        </h2>

    </div>


    <div
        id="errorMessage"
        class="error"
    ></div>


    <section class="card">

        <h2>
            Your Order
        </h2>

        <div id="orderItems"></div>

        <div class="total">

            <strong>
                TOTAL
            </strong>

            <strong id="orderTotal">
                ₹0
            </strong>

        </div>

    </section>


    <section class="card">

        <h2>
            Customer Details
        </h2>


        <label for="customerName">
            Your Name
        </label>

        <input
            id="customerName"
            type="text"
            placeholder="Enter your name"
            autocomplete="name"
        >


        <label for="customerPhone">
            Mobile Number
        </label>

        <input
            id="customerPhone"
            type="tel"
            placeholder="Enter mobile number"
            inputmode="numeric"
            maxlength="10"
        >


        <label for="notes">
            Special Request
        </label>

        <textarea
            id="notes"
            placeholder="Less spicy, no onion, etc. (optional)"
        ></textarea>

    </section>


    <section class="card">

        <h2>
            Payment
        </h2>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="cash"
                checked
            >

            <div>

                <div class="payment-title">
                    💵 Cash
                </div>

                <div class="payment-description">
                    Pay at the restaurant
                </div>

            </div>

        </label>


        <label class="payment-option">

            <input
                type="radio"
                name="payment"
                value="upi"
            >

            <div>

                <div class="payment-title">
                    📱 UPI
                </div>

                <div class="payment-description">
                    Pay using your UPI app
                </div>

            </div>

        </label>

    </section>


    <button
        class="place-order"
        id="placeOrderButton"
        onclick="placeOrder()"
    >

        PLACE ORDER

    </button>


    <a
        href="#"
        class="back-button"
        onclick="goBackToMenu(); return false;"
    >
        ← Back to Menu
    </a>


</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="checkout.js"></script>


</body>

</html>
