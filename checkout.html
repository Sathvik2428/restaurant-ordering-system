<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - Rajathadri Palace</title>

    <link rel="stylesheet" href="checkout.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">
</head>

<body>

    <!-- HEADER -->

    <header class="top-header">

        <div class="logo-center">

            <div class="logo-circle">
                <span>R</span>
            </div>

            <div class="logo-text">

                <h1>RAJATHADRI PALACE</h1>

                <p>
                    TRADITION • TASTE • TRUST
                </p>

            </div>

        </div>

    </header>


    <!-- CHECKOUT -->

    <main class="checkout-page">

        <div class="checkout-container">

            <div class="checkout-title">

                <span>◆</span>

                <h2>CONFIRM ORDER</h2>

                <span>◆</span>

            </div>


            <!-- TABLE INFORMATION -->

            <div class="table-info-card">

                <p>YOU ARE ORDERING FROM</p>

                <h3 id="tableNumber">
                    TABLE -
                </h3>

            </div>


            <!-- ORDER -->

            <section class="checkout-section">

                <h3>Your Order</h3>

                <div id="checkoutItems"></div>

                <div class="checkout-total">

                    <span>Total</span>

                    <strong id="checkoutTotal">
                        ₹0
                    </strong>

                </div>

            </section>


            <!-- CUSTOMER DETAILS -->

            <section class="checkout-section">

                <h3>Customer Details</h3>

                <div class="form-group">

                    <label for="customerName">
                        Name
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="customerPhone">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="customerPhone"
                        placeholder="Enter mobile number"
                        maxlength="10"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="orderNotes">
                        Special Request
                    </label>

                    <textarea
                        id="orderNotes"
                        placeholder="Any special request?"
                        rows="3"
                    ></textarea>

                </div>

            </section>


            <!-- PAYMENT INFORMATION -->

            <section class="payment-info">

                <div class="payment-icon">
                    🧾
                </div>

                <div>

                    <h3>
                        Pay at the end
                    </h3>

                    <p>
                        You don't need to pay for this order now.
                        You can order more food later and pay the
                        complete table bill together.
                    </p>

                </div>

            </section>


            <!-- PLACE ORDER -->

            <button
                id="placeOrderBtn"
                class="place-order-btn"
                onclick="placeOrder()"
            >
                PLACE ORDER
            </button>


            <!-- MESSAGE -->

            <div
                id="checkoutMessage"
                class="checkout-message"
            ></div>


            <!-- ORDER MORE -->

            <button
                id="orderMoreBtn"
                class="order-more-btn"
                onclick="orderMore()"
                style="display:none;"
            >
                + ORDER MORE FOOD
            </button>


            <!-- FINAL BILL -->

            <button
                id="billBtn"
                class="bill-btn"
                onclick="requestBill()"
                style="display:none;"
            >
                🧾 REQUEST FINAL BILL
            </button>

        </div>

    </main>


    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <script src="checkout.js"></script>

    <!-- Include this before the closing </body> tag of checkout.html -->
    <script type="module">
  import { db, collection, addDoc, serverTimestamp } from "./firebase-config.js";

  // 1. Extract table number from URL query: checkout.html?table=3
  const urlParams = new URLSearchParams(window.location.search);
  const tableNumber = urlParams.get("table") || "Takeaway";

  // Update table number in your UI header if the element exists
  const tableDisplay = document.querySelector("h3");
  if (tableDisplay && tableDisplay.textContent.includes("TABLE")) {
    tableDisplay.textContent = `TABLE ${tableNumber}`;
  }

  // 2. Reference your confirm order button and form inputs
  const confirmBtn = document.getElementById("confirm-order-btn") || document.querySelector("button");

  confirmBtn.addEventListener("click", async (e) => {
    e.preventDefault();

    // Pull cart data (assuming you save cart in localStorage from menu.html)
    const cart = JSON.parse(localStorage.getItem("cart")) || [];
    if (cart.length === 0) {
      alert("Your cart is empty!");
      return;
    }

    const customerName = document.getElementById("customer-name")?.value || "Guest";
    const customerPhone = document.getElementById("customer-phone")?.value || "N/A";
    const totalAmount = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);

    confirmBtn.disabled = true;
    confirmBtn.innerText = "Placing Order...";

    try {
      // 3. Write document to Firestore 'orders' collection
      const docRef = await addDoc(collection(db, "orders"), {
        table: tableNumber,
        customer: {
          name: customerName,
          phone: customerPhone
        },
        items: cart,
        total: totalAmount,
        status: "Pending", // Pending -> Preparing -> Served
        createdAt: serverTimestamp()
      });

      // 4. Clear cart and redirect
      localStorage.removeItem("cart");
      window.location.href = `order-history.html?orderId=${docRef.id}&table=${tableNumber}`;
    } catch (error) {
      console.error("Error submitting order: ", error);
      alert("Failed to place order. Please try again or inform the counter.");
      confirmBtn.disabled = false;
      confirmBtn.innerText = "Confirm Order";
    }
  });
</script>
</body>

</html>
