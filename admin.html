<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - Rajathadri Palace</title>

    <link rel="stylesheet" href="admin.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

</head>


<body>
<!-- STAFF PIN LOCK OVERLAY -->
<div id="pinLockModal" style="position:fixed; inset:0; background:#0a0a0a; z-index:999999; display:flex; align-items:center; justify-content:center; padding:20px;">
    <div style="background:#161616; border:2px solid #d4af37; border-radius:16px; padding:30px; text-align:center; max-width:340px; width:100%; box-shadow:0 10px 40px rgba(0,0,0,0.9);">
        <div style="width:50px; height:50px; border:1px solid #d4af37; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 15px auto; color:#d4af37; font-size:1.5rem;">🔒</div>
        <h2 style="font-family:'Cinzel', serif; color:#d4af37; font-size:1.3rem; margin-bottom:8px;">STAFF PORTAL</h2>
        <p style="color:#aaa; font-size:0.85rem; margin-bottom:20px;">Enter Admin PIN to continue</p>
        <input type="password" id="adminPinInput" maxlength="6" placeholder="Enter PIN" style="width:100%; text-align:center; font-size:1.4rem; letter-spacing:4px; padding:10px; border:1px solid #443a18; border-radius:8px; background:#080808; color:#fff; outline:none; margin-bottom:15px;">
        <button onclick="verifyAdminPin()" style="width:100%; padding:12px; background:#d4af37; color:#111; border:none; border-radius:8px; font-weight:700; cursor:pointer;">UNLOCK</button>
        <p id="pinErrorMsg" style="color:#ff6b6b; font-size:0.8rem; margin-top:12px; display:none;">Incorrect PIN. Try again.</p>
    </div>
</div>
    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="admin-header">

        <div class="admin-brand">

            <div class="admin-logo">
                R
            </div>

            <div>

                <h1>
                    RAJATHADRI PALACE
                </h1>

                <p>
                    HOTEL ADMIN DASHBOARD
                </p>

            </div>

        </div>


        <div class="admin-status">

            <span class="status-dot"></span>

            <span>
                SYSTEM ONLINE
            </span>

        </div>

    </header>


    <!-- =====================================
         MAIN
    ====================================== -->

    <main class="admin-container">


        <!-- PAGE TITLE -->

        <section class="page-heading">

            <div>

                <h2>
                    ORDER DASHBOARD
                </h2>

                <p>
                    Manage and monitor customer orders
                </p>

            </div>


            <button
                id="refreshBtn"
                class="refresh-btn"
                onclick="loadOrders()"
            >
                ↻ REFRESH
            </button>

        </section>


        <!-- =====================================
             STATISTICS
        ====================================== -->

        <section class="stats-grid">


            <div class="stat-card">

                <span class="stat-label">
                    TOTAL ORDERS
                </span>

                <strong id="totalOrders">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    NEW
                </span>

                <strong id="newOrders">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    PREPARING
                </span>

                <strong id="preparingOrders">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <span class="stat-label">
                    READY
                </span>

                <strong id="readyOrders">
                    0
                </strong>

            </div>


        </section>


        <!-- =====================================
             FILTERS
        ====================================== -->

        <section class="filter-section">

            <button
                class="filter-btn active"
                data-status="all"
                onclick="filterOrders('all')"
            >
                ALL
            </button>


            <button
                class="filter-btn"
                data-status="new"
                onclick="filterOrders('new')"
            >
                NEW
            </button>


            <button
                class="filter-btn"
                data-status="preparing"
                onclick="filterOrders('preparing')"
            >
                PREPARING
            </button>


            <button
                class="filter-btn"
                data-status="ready"
                onclick="filterOrders('ready')"
            >
                READY
            </button>


            <button
                class="filter-btn"
                data-status="served"
                onclick="filterOrders('served')"
            >
                SERVED
            </button>


            <button
                class="filter-btn"
                data-status="cancelled"
                onclick="filterOrders('cancelled')"
            >
                CANCELLED
            </button>

        </section>


        <!-- =====================================
             ORDERS
        ====================================== -->

        <section class="orders-section">

            <div class="section-title">

                <h2>
                    CUSTOMER ORDERS
                </h2>

                <span id="orderCount">
                    0 orders
                </span>

            </div>


            <div id="ordersContainer">

                <div class="loading">

                    Loading orders...

                </div>

            </div>

        </section>


    </main>


    <!-- =====================================
         SUPABASE
    ====================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>

    <script src="admin.js"></script>


</body>

</html>
