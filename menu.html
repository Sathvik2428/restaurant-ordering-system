<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Rajathadri Palace</title>
    <link rel="stylesheet" href="menu.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>

<header class="top-header">
    <div class="logo-center">
        <div class="logo-circle"><span>R</span></div>
        <div class="logo-text">
            <h1>RAJATHADRI PALACE</h1>
            <p>TRADITION • TASTE • TRUST</p>
        </div>
    </div>
    <div class="cart-icon" onclick="openCart()">🛒<span class="cart-badge" id="topCartCount">0</span></div>
</header>

<div class="page-title">
    <div class="menu-heading">
        <span class="diamond">◆</span>
        <h2>MENU</h2>
        <span class="diamond">◆</span>
    </div>
    <div class="menu-design">❦</div>
</div>

<div class="search-bar-container">
    <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="text" placeholder="Search for food..." oninput="searchMenu(this.value)">
        <span class="filter-icon">⚙</span>
    </div>
</div>

<div class="categories-wrapper">
    <div class="categories-container" id="categories"></div>
    <div class="scroll-hint">← Swipe categories →</div>
</div>

<main id="menuContainer"></main>

<div class="bottom-spacer"></div>

<div class="sticky-cart-bar">
    <div class="cart-details">
        <div class="cart-icon-large">
            🛒 <span class="cart-badge-large" id="cartCount">0</span>
        </div>
        <div class="cart-text">
            <p>Items in Cart</p>
            <h4 id="cartTotal">₹0</h4>
        </div>
    </div>
    <button class="view-cart-btn" onclick="openCart()">VIEW CART →</button>
</div>

<nav class="bottom-nav">
    <a href="#" class="nav-item active" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">
        <span class="icon">🍽️</span><p>Menu</p>
    </a>
    <a href="order-history.html" class="nav-item">
        <span class="icon">📋</span><p>Order History</p>
    </a>
</nav>

<div id="cartModal" class="cart-modal" onclick="closeCart(event)">
    <div class="cart-panel" onclick="event.stopPropagation()">
        <div class="cart-panel-header">
            <h2>Your Cart</h2>
            <button onclick="closeCart()">×</button>
        </div>
        <div id="cartItems"></div>
        <div class="cart-total-row">
            <strong>Total</strong>
            <strong id="modalTotal">₹0</strong>
        </div>
        <button class="clear-cart" onclick="clearCart()">CLEAR CART</button>
    </div>
</div>

<script src="menu.js"></script>
</body>
</html>
