<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rajathgiri Place</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts: Cinzel Decorative for the swash serif, Montserrat for clean sans-serif -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    
</head>
<body>
    
    <!-- Main Content Area -->
    <main class="hero-section">
        <div class="welcome-badge">
            <span class="diamond">&#10022;</span> WELCOME TO <span class="diamond">&#10022;</span>
        </div>
        
        <h2 class="hero-title">RAJATHAGIRI<br>PALACE</h2>
        
        <div class="ornate-divider">
            <div class="line"></div>
            <span class="flower">&#10043;</span>
            <div class="line"></div>
        </div>
        
        <p class="hero-subtitle">TRADITIONAL HERITAGE. EXQUISITE TASTE.</p>
        
        <div class="action-steps">
            <span class="flower-icon">&#10043;</span>
            <span class="step-text">SCAN <span class="dot">&bull;</span> ORDER <span class="dot">&bull;</span> PAY <span class="dot">&bull;</span> ENJOY</span>
            <span class="flower-icon">&#10043;</span>
        </div>
        
        <a href="menu.html" class="btn-start-ordering">
            ✻ START ORDERING ✻
        </a>
        
        <div class="table-card">
            <div class="table-icon">&#127869;</div>
            <p class="ordering-from"><span class="diamond">&#10022;</span> YOU ARE ORDERING FROM <span class="diamond">&#10022;</span></p>
            <h3 class="table-number">TABLE 5</h3>
        </div>
    </main>
<script>
    // 1. Read table from URL (e.g., ?table=1)
    const urlParams = new URLSearchParams(window.location.search);
    const tableNumber = urlParams.get("table");

    if (tableNumber) {
        // Check if the customer moved to a new table or is starting fresh
        const storedTable = localStorage.getItem("rajathadri_table");
        
        if (storedTable !== tableNumber) {
            // Clear previous cart & session so it freshly opens
            localStorage.removeItem("rajathadri_cart");
            localStorage.removeItem("rajathadri_session_id");
            localStorage.removeItem("rajathadri_order_token");
        }

        // Save current table
        localStorage.setItem("rajathadri_table", tableNumber);

        // Update the display text on index.html
        const tableCardHeading = document.querySelector(".table-number");
        if (tableCardHeading) {
            tableCardHeading.textContent = "TABLE " + tableNumber;
        }

        // Update the "Start Ordering" link to carry the table parameter
        const orderBtn = document.querySelector(".btn-start-ordering");
        if (orderBtn) {
            orderBtn.href = "menu.html?table=" + encodeURIComponent(tableNumber);
        }
    }
</script>
</body>
</html>
