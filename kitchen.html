<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Display - Rajathadri Palace</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --card-bg: #1a1a1a;
      --gold: #d4af37;
      --blue: #38bdf8;
      --green: #22c55e;
      --text: #f5f5f5;
      --text-muted: #888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #332a0d; padding-bottom: 15px; margin-bottom: 25px; }
    h1 { font-size: 1.6rem; color: var(--gold); }
    #soundBanner { background: #b91c1c; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; border: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
    .ticket { background: var(--card-bg); border-radius: 10px; border-left: 6px solid var(--gold); padding: 18px; display: flex; flex-direction: column; justify-content: space-between; border-top: 1px solid #292929; border-right: 1px solid #292929; border-bottom: 1px solid #292929; }
    .ticket.preparing { border-left-color: var(--blue); }
    .ticket.ready { border-left-color: var(--green); }
    .ticket-header { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px dashed #3a3a3a; padding-bottom: 10px; }
    .table-tag { font-size: 1.4rem; font-weight: bold; color: var(--gold); }
    .status-badge { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    .items-list { margin: 15px 0; list-style: none; }
    .items-list li { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #262626; font-size: 0.95rem; }
    .qty { font-weight: bold; color: var(--gold); margin-right: 10px; }
    .notes { margin-top: 8px; font-size: 0.85rem; color: #ffb347; font-style: italic; }
    .actions { display: flex; gap: 8px; margin-top: 15px; }
    button.action-btn { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; color: #111; background: var(--gold); }
    .btn-prep { background: var(--blue); color: #fff; }
    .btn-done { background: var(--green); color: #fff; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>RAJATHADRI PALACE — Kitchen Orders</h1>
      <small style="color: var(--text-muted)">Live Supabase Feed</small>
    </div>
    <button id="soundBanner">🔔 Enable Audio Alerts</button>
  </header>

  <div class="grid" id="ordersContainer">Loading live orders...</div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let audioEnabled = false;
    let orders = [];

    const soundBanner = document.getElementById("soundBanner");
    const container = document.getElementById("ordersContainer");

    function playChime() {
      if (!audioEnabled) return;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(659.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.6);
      } catch (e) { console.warn(e); }
    }

    soundBanner.addEventListener("click", () => {
      audioEnabled = true;
      soundBanner.style.background = "#15803d";
      soundBanner.textContent = "🔊 Audio Active";
      playChime();
    });

    async function fetchKitchenOrders() {
      const { data, error } = await supabaseClient
        .from("orders")
        .select("*")
        .in("order_status", ["new", "preparing", "ready"])
        .order("created_at", { ascending: true });

      if (error) {
        container.innerHTML = `<p>Error loading kitchen tickets: ${error.message}</p>`;
        return;
      }
      orders = data || [];
      renderTickets();
    }

    function renderTickets() {
      if (orders.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); grid-column:1/-1;">No pending kitchen orders.</p>`;
        return;
      }

      container.innerHTML = orders.map(order => {
        const items = Array.isArray(order.items) ? order.items : [];
        const itemsHtml = items.map(item => `
          <li>
            <span><span class="qty">${item.qty}×</span>${item.name}</span>
          </li>
        `).join("");

        return `
          <div class="ticket ${order.order_status}">
            <div>
              <div class="ticket-header">
                <span class="table-tag">TABLE ${order.table_no}</span>
                <span class="status-badge">${order.order_status}</span>
              </div>
              <p style="margin: 6px 0; font-size: 0.8rem; color: var(--text-muted);">
                #${order.order_number} • ${new Date(order.created_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}
              </p>
              <ul class="items-list">${itemsHtml}</ul>
              ${order.notes ? `<div class="notes">Note: ${order.notes}</div>` : ""}
            </div>
            <div class="actions">
              ${order.order_status === "new" ? `<button class="action-btn btn-prep" onclick="updateStatus('${order.id}', 'preparing')">Start Preparing</button>` : ""}
              ${order.order_status === "preparing" ? `<button class="action-btn btn-done" onclick="updateStatus('${order.id}', 'ready')">Mark Ready</button>` : ""}
              ${order.order_status === "ready" ? `<button class="action-btn" onclick="updateStatus('${order.id}', 'served')">Mark Served</button>` : ""}
            </div>
          </div>
        `;
      }).join("");
    }

    async function updateStatus(id, newStatus) {
      const { error } = await supabaseClient
        .from("orders")
        .update({ order_status: newStatus })
        .eq("id", id);

      if (error) alert("Error updating status: " + error.message);
      else fetchKitchenOrders();
    }

    supabaseClient
      .channel("kitchen-realtime")
      .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, (payload) => {
        if (payload.eventType === "INSERT") playChime();
        fetchKitchenOrders();
      })
      .subscribe();

    fetchKitchenOrders();
  </script>
</body>
</html>
