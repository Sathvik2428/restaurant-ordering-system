<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Status & Bill - Rajathadri Palace</title>

    <link rel="stylesheet" href="checkout.css">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        /* CRASH-PROOF BILL MODAL STYLING */
        .bill-modal {
            position: fixed !important;
            inset: 0 !important;
            width: 100vw !important;
            height: 100vh !important;
            background: rgba(0, 0, 0, 0.88) !important;
            display: none !important;
            align-items: center !important;
            justify-content: center !important;
            z-index: 99999 !important;
            padding: 20px !important;
            backdrop-filter: blur(4px);
        }

        .bill-modal.show {
            display: flex !important;
        }

        .bill-card {
            width: min(500px, 95%) !important;
            max-height: 85vh !important;
            overflow-y: auto !important;
            background: #141414 !important;
            border: 2px solid #d4af37 !important;
            border-radius: 16px !important;
            padding: 22px !important;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.9) !important;
            color: #ffffff !important;
        }

        .bill-card-header {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4) !important;
            padding-bottom: 12px !important;
            margin-bottom: 16px !important;
        }

        .bill-card-header h2 {
            font-family: 'Cinzel', serif !important;
            color: #d4af37 !important;
            font-size: 1.25rem !important;
            margin: 0 !important;
        }

        .close-btn {
            background: transparent !important;
            border: none !important;
            color: #d4af37 !important;
            font-size: 1.8rem !important;
            cursor: pointer !important;
            line-height: 1 !important;
        }

        .payment-options {
            margin-top: 20px !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 12px !important;
        }

        .btn-upi {
            background: #15803d !important;
            border: 1px solid #22c55e !important;
            color: #ffffff !important;
            padding: 14px !important;
            border-radius: 30px !important;
            font-family: 'Cinzel', serif !important;
            font-weight: 700 !important;
            font-size: 0.9rem !important;
            cursor: pointer !important;
            text-align: center !important;
            text-decoration: none !important;
            display: block !important;
            letter-spacing: 1px !important;
        }

        .btn-cash {
            background: transparent !important;
            border: 1px solid #d4af37 !important;
            color: #d4af37 !important;
            padding: 14px !important;
            border-radius: 30px !important;
            font-family: 'Cinzel', serif !important;
            font-weight: 700 !important;
            font-size: 0.9rem !important;
            cursor: pointer !important;
            letter-spacing: 1px !important;
            width: 100% !important;
        }

        .btn-upi:hover { background: #166534 !important; }
        .btn-cash:hover { background: rgba(212, 175, 55, 0.15) !important; }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="top-header">
        <div class="logo-center">
            <div class="logo-circle">
                <span>R</span>
            </div>
            <div class="logo-text">
                <h1>RAJATHADRI PALACE</h1>
                <p>TRADITION • TASTE • TRUST</p>
            </div>
        </div>
    </header>

    <!-- ORDER STATUS -->
    <main class="checkout-page">
        <div class="checkout-container">

            <div class="checkout-title">
                <span>◆</span>
                <h2>ORDER STATUS</h2>
                <span>◆</span>
            </div>

            <!-- ORDER INFORMATION -->
            <section class="checkout-section">
                <h3>Your Table Orders</h3>
                <div id="orderInformation">
                    <p>Loading table orders...</p>
                </div>
            </section>

            <!-- PROGRESS STATUS -->
            <section class="checkout-section">
                <h3>Order Progress</h3>
                <div id="orderStatus">
                    <p>Checking status...</p>
                </div>
            </section>

            <!-- ORDER MORE -->
            <button
                id="orderMoreBtn"
                class="order-more-btn"
                onclick="orderMore()"
            >
                + ORDER MORE FOOD
            </button>

            <!-- FINAL BILL BUTTON -->
            <button
                id="billBtn"
                class="bill-btn"
                onclick="openFinalBillModal()"
            >
                🧾 VIEW FINAL BILL & PAY
            </button>

            <!-- MESSAGE -->
            <div id="statusMessage" class="checkout-message"></div>

        </div>
    </main>

    <!-- BILL & PAYMENT POPUP MODAL -->
    <div id="finalBillModal" class="bill-modal" onclick="closeOnBackdrop(event)">
        <div class="bill-card" onclick="event.stopPropagation()">
            <div class="bill-card-header">
                <h2>TABLE BILL BREAKDOWN</h2>
                <button class="close-btn" onclick="closeFinalBillModal()">✕</button>
            </div>

            <div id="billBreakdownContent">
                <!-- Dynamically populated with orders -->
            </div>

            <div class="payment-options">
                <a id="payUpiBtn" href="#" class="btn-upi">
                    ⚡ PAY ONLINE (GPay / PhonePe / Paytm)
                </a>
                <button type="button" class="btn-cash" onclick="chooseCashPayment()">
                    💵 PAY CASH AT COUNTER / RESTAURANT
                </button>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="order-status.js"></script>

</body>

</html>
